<!-- Login — Microsoft Fluent Design 2 — Titulacion ISTPET -->
<div class="fluent-shell" [attr.data-theme]="isDarkMode() ? 'dark' : 'light'">
  <!-- ============================================================ -->
  <!-- FONDO — Formas geométricas abstractas (estilo MS 365 real)  -->
  <!-- ============================================================ -->
  <div class="fluent-bg" aria-hidden="true">
    <div class="bg-shape s1"></div>
    <div class="bg-shape s2"></div>
    <div class="bg-shape s3"></div>
    <div class="bg-shape s4"></div>
    <div class="bg-shape s5"></div>
  </div>

  <!-- Toggle de tema -->
  <button
    class="fluent-theme-btn"
    type="button"
    (click)="toggleTheme()"
    [title]="isDarkMode() ? 'Modo claro' : 'Modo oscuro'"
  >
    <svg
      *ngIf="!isDarkMode()"
      xmlns="http://www.w3.org/2000/svg"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <circle cx="12" cy="12" r="5" />
      <line x1="12" y1="1" x2="12" y2="3" />
      <line x1="12" y1="21" x2="12" y2="23" />
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
      <line x1="1" y1="12" x2="3" y2="12" />
      <line x1="21" y1="12" x2="23" y2="12" />
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
    </svg>
    <svg
      *ngIf="isDarkMode()"
      xmlns="http://www.w3.org/2000/svg"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    </svg>
  </button>

  <!-- ============================================================ -->
  <!-- TARJETA CENTRADA                                             -->
  <!-- ============================================================ -->
  <main class="fluent-card" role="main">
    <!-- Logo ISTPET -->
    <div class="istpet-logo" aria-label="ISTPET Titulación">
      <img
        [src]="isDarkMode() ? 'logo_blanco.webp' : 'logo_istpet_color.webp'"
        alt="Logo ISTPET"
        class="logo-img"
      />
    </div>

    <!-- Título -->
    <h1 class="fluent-heading">Iniciar sesión</h1>

    <!-- Error -->
    <div *ngIf="errorMessage()" class="fluent-error" role="alert">{{ errorMessage() }}</div>

    <!-- Formulario -->
    <form (ngSubmit)="onSubmit()" class="fluent-form" novalidate>
      <div class="fluent-field">
        <label for="f-username" class="fluent-label">Correo o nombre de usuario</label>
        <input
          id="f-username"
          type="text"
          name="username"
          class="fluent-input"
          [(ngModel)]="usernameOrEmail"
          placeholder="usuario@istpet.edu.ec"
          autocomplete="username"
          required
        />
      </div>

      <div class="fluent-field">
        <label for="f-password" class="fluent-label">Contraseña</label>
        <div class="fluent-input-wrap">
          <input
            id="f-password"
            [type]="showPassword() ? 'text' : 'password'"
            name="password"
            class="fluent-input fluent-password-input"
            [(ngModel)]="password"
            placeholder="Contraseña"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            class="fluent-password-toggle-btn"
            (click)="toggleShowPassword()"
            [title]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            tabindex="-1"
          >
            <!-- Eye icon (mostrar) -->
            <svg
              *ngIf="!showPassword()"
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <!-- Eye Off icon (ocultar) -->
            <svg
              *ngIf="showPassword()"
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
              ></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="fluent-btn-primary" [disabled]="isLoading()">
        <span *ngIf="!isLoading()">Iniciar sesión</span>
        <span *ngIf="isLoading()" class="fluent-spinner-wrap">
          <span class="fluent-spinner"></span>
          <span>Autenticando...</span>
        </span>
      </button>
    </form>

    <!-- Footer de la tarjeta -->
    <p class="fluent-card-footer">Sistema de Titulación Académica · ISTPET</p>
  </main>

  <!-- Footer legal de pantalla (como Microsoft) -->
  <footer class="fluent-legal">
    <a href="#" tabindex="-1">Términos de uso</a>
    <span aria-hidden="true">·</span>
    <a href="#" tabindex="-1">Privacidad y cookies</a>
    <span aria-hidden="true">·</span>
    <span>© {{ currentYear }} Instituto Tecnológico Superior Traversari</span>
  </footer>
</div>
