name: PR Gate

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches: [main, develop]

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  mergeable:
    name: Sin conflictos de merge
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # GitHub calcula la mergeabilidad de forma asincrona: recien abierto el PR
      # el estado es "unknown" durante unos segundos. Reintentamos antes de decidir.
      - name: Verificar mergeabilidad
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            for (let intento = 1; intento <= 10; intento++) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });

              if (pr.mergeable === true) {
                core.info(`Mergeable limpio (estado: ${pr.mergeable_state}).`);
                return;
              }

              if (pr.mergeable === false) {
                core.setFailed(
                  `Este PR tiene conflictos con '${pr.base.ref}'. ` +
                  `Actualiza tu rama (git fetch origin && git rebase origin/${pr.base.ref}), ` +
                  `resuelve los conflictos y vuelve a subir.`
                );
                return;
              }

              core.info(`Mergeabilidad aun no calculada (intento ${intento}/10), esperando...`);
              await new Promise((r) => setTimeout(r, 5000));
            }

            core.setFailed('GitHub no logro calcular la mergeabilidad. Reintenta el check.');

  titulo:
    name: Titulo con formato Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validar titulo del PR
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          PATRON='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9./-]+\))?!?: .{1,}$'
          if ! printf '%s' "$TITULO" | grep -qE "$PATRON"; then
            echo "::error::Titulo invalido: '$TITULO'"
            echo "Formato esperado: <tipo>(<alcance opcional>): <descripcion>"
            echo "Ejemplos: 'feat(backend): endpoint de estudiantes', 'fix(frontend): filtro por cedula'"
            exit 1
          fi
          echo "Titulo valido."

  sin-marcadores:
    name: Sin marcadores de conflicto en el codigo
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Un conflicto "resuelto" a mano dejando los marcadores dentro del archivo
      # compila en algunos lenguajes y pasa desapercibido. Aqui no.
      - name: Buscar marcadores
        run: |
          BASE=origin/${{ github.event.pull_request.base.ref }}
          ARCHIVOS=$(git diff --name-only --diff-filter=d "$BASE"...HEAD)
          [ -z "$ARCHIVOS" ] && { echo "Sin archivos modificados."; exit 0; }

          ENCONTRADOS=0
          for archivo in $ARCHIVOS; do
            if grep -nE '^(<{7}|={7}|>{7})( |$)' "$archivo" >/dev/null 2>&1; then
              echo "::error file=$archivo::Marcadores de conflicto sin resolver."
              grep -nE '^(<{7}|={7}|>{7})( |$)' "$archivo" | head -5
              ENCONTRADOS=1
            fi
          done
          exit $ENCONTRADOS
