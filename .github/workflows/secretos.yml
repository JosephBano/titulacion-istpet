name: Escaneo de secretos

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: secretos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitguardian:
    name: GitGuardian (ggshield)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # ggshield escanea todos los commits del PR, no solo el diff final:
          # un secreto agregado y luego "borrado" sigue vivo en el historial.
          fetch-depth: 0

      - name: Verificar que la API key esta configurada
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          if [ -z "$GITGUARDIAN_API_KEY" ]; then
            echo "::warning::Falta el secreto GITGUARDIAN_API_KEY en GitHub Secrets. Se omitirá el escaneo de GitGuardian."
            echo "Para activarlo, créala en https://dashboard.gitguardian.com/api/personal-access-tokens"
            echo "y regístrala con: gh secret set GITGUARDIAN_API_KEY"
          fi

      - name: Escanear
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        if: ${{ env.GITGUARDIAN_API_KEY != '' }}
        uses: GitGuardian/ggshield-action@v1

  archivos-prohibidos:
    name: Archivos que nunca deben commitearse
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # Red de seguridad independiente de GitGuardian: si alguien usa `git add -f`
      # para saltarse el .gitignore, esto lo detiene igual.
      - name: Buscar configuracion sensible versionada
        run: |
          PATRONES='(^|/)appsettings\.json$|(^|/)appsettings\.Development\.json$|(^|/)appsettings\.Production\.json$|environment\.prod\.ts|^\.env$|\.pem$|\.pfx$|\.p12$|\.key$|id_rsa'
          ENCONTRADOS=$(git ls-files | grep -E "$PATRONES" || true)
          if [ -n "$ENCONTRADOS" ]; then
            echo "::error::Hay archivos sensibles versionados:"
            echo "$ENCONTRADOS"
            echo "Quitalos con 'git rm --cached <archivo>' y usa la plantilla *.example.* correspondiente."
            exit 1
          fi
          echo "Sin archivos sensibles versionados."
